<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#777"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="850" fill="#ffffff"/>

  <!-- Root -->
  <rect x="20" y="378" width="160" height="74" rx="12" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
  <text x="100" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">第二章</text>
  <text x="100" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">补体通路</text>

  <!-- Level 1 -->
